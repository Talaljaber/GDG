name: Keepalive

# Every 6 hours at minute 17 (avoids GitHub's top-of-hour scheduling delays).
# docs/DEPLOYMENT.md §4 / ADR-128.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [prod, dev]
    env:
      SUPABASE_URL: ${{ matrix.target == 'prod' && secrets.SUPABASE_URL_PROD || secrets.SUPABASE_URL_DEV }}
      SUPABASE_PUBLISHABLE_KEY: ${{ matrix.target == 'prod' && secrets.SUPABASE_PUBLISHABLE_KEY_PROD || secrets.SUPABASE_PUBLISHABLE_KEY_DEV }}
    steps:
      - name: Ping ${{ matrix.target }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "Skipping ${{ matrix.target }}: secret not set."
            exit 0
          fi
          curl -fsS -X POST "$SUPABASE_URL/rest/v1/rpc/keepalive" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
